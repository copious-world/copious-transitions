<script>
	//
	// ---- ---- ---- ---- ---- ---- ---- ---- ---- ----

	async function media_startup(tracking,protocol,media,counter_link,session) { // _x_link_counter > counter_link
		if ( protocol === 'ipfs' ) {
			let links = await crypto_ready_counted(counter_link,tracking,session,media)  // src is for checking...
			return links
		} else if ( protocol === 'local' ) {
			let links = await clear_counted(counter_link,tracking,session,media)  // src is for checking...
			return links
		} else {		// default
			counter_link = "localhost:7777"
			let links = await clear_counted(counter_link,tracking,session,media)
			return links
		}
	}

	// ---- ---- ---- ---- ---- ---- ---- ---- ---- ----

	// the counter link is complete, stored in the _x_link_counter field of the meta object

	async function crypto_ready_counted(counter_link,tracking,session,src) {
		//
		let prot = "https:"
		let sp = "//"
		let url = `${prot}${sp}${counter_link}/key-media/${tracking}`
		if ( (typeof session === 'string') && (session.length > 0) ) {
			url += `/${session}`
		}
		//
		try {
			let result = await fetchUrl(url)
			if ( result.status === "OK" ) {
				return result.links
			}
		} catch(e) {
		}
		return false
	}


	async function clear_counted(counter_link,tracking,session,src) {
		//
		let prot = location.protocol
		let sp = "//"
		let url = `${prot}${sp}${counter_link}/clear-media/${tracking}`
		if ( (typeof session === 'string') && session.length > 0 ) {
			url += `/${session}`
		}
		//
		try {
			let result = await fetchUrl(url)
			if ( result.status === "OK" ) {
				return result.links
			}
		} catch(e) {
		}
		return false
	}

	}

</script>

<script>

	async function postData(url = '', data = {}, creds = 'omit', do_stringify = true) {
		// Default options are marked with *
		const response = await fetch(url, {
			method: 'POST', // *GET, POST, PUT, DELETE, etc.
			mode: 'cors', // no-cors, *cors, same-origin
			cache: 'no-cache', // *default, no-cache, reload, force-cache, only-if-cached
			credentials: creds, // include, *same-origin, omit
			headers: {
				'Content-Type': 'application/json'
			},
			redirect: 'follow', // manual, *follow, error
			referrerPolicy: 'no-referrer', // no-referrer, *client
			body: (do_stringify ? JSON.stringify(data)  : data)	// body data type must match "Content-Type" header
		});
		if ( response.ok == false ) {
			console.log(response.status + ': ' + response.statusText)
		}
		return await response.json(); // parses JSON response into native JavaScript objects
	}

	function hide_interface_box() {
		let display = document.getElementById('interface-box')
		if ( display ) {
			display.style.visibility = "hidden"
			display.style.display = "none"
		}
	}

	function hide_box(bxname) {
		let display = document.getElementById(bxname)
		if ( display ) {
			display.style.visibility = "hidden"
			display.style.display = "none"
		}
	}

	function show_box(bxname) {
		let display = document.getElementById(bxname)
		if ( display ) {
			display.style.visibility = "visible"
			display.style.display = "block"
		}
	}

	hide_box('error-box')
	hide_box('success-box')

	async function post_submit(fields) {
		let bdy = {}
		fields.forEach(element => {
			let fld = document.getElementById(element)
			if ( fld ) {
				bdy[element] = fld.value
			}
		});
		let url = bdy.post_url
		if ( url ) {
			delete bdy.post_url
			//
			let resp = await postData(url, bdy)
			//
			if ( resp ) hide_interface_box()
			if ( resp && (resp.OK === 'true') ) {
				show_box('success-box')
			} else {
				show_box('error-box')
			}
		}
	}


	async function fetchUrl(endpoint) {
		let myRequest = new Request(endpoint);
		try {
			const body = await fetch(myRequest, {
										method: 'GET', // *GET, POST, PUT, DELETE, etc.
										mode: 'cors', // no-cors, *cors, same-origin
										cache: 'no-cache', // *default, no-cache, reload, force-cache, only-if-cached
										credentials: 'omit', // include, *same-origin, omit
										redirect: 'follow', // manual, *follow, error
										referrerPolicy: 'no-referrer', // no-referrer, *client
									});
			//
			let infoObj = await body.json();
			return(infoObj)
			//
		} catch (e) {
			console.log(e.message)
			return(false)
		}
	}

            return false
        }

        this.requesting_members[req_hash] = { id, req_hash, screen_name, url, icon_url, join_time }

    /**

     * body.message ? body.message.server_id
     * body.transition
     * 
     * @param {string} req_hash 
     * @param {object} message 
     */
    send_message(req_hash,message) {
        if ( this.chat_room_members[req_hash] ) {
            if ( this.socket ) {
                let JSONrpc = {
                    "jsonrpc" : "2.0",
                    "method" : "chat-message",
                    "parameters" : {
                        "human_page" : this.source_url,
                        "req_hash" : req_hash,
                        "message" : message
                    }
                }

                let transition_body = {
                    "transition" : "human-chat",
                    "server_id" : this.server_url,
                    "message" : {
                        "ws_id" : this.ws_id,
                        "session" : this.session,
                        "JSONrpc" : JSONrpc
                    }
                }

                let transition_app_ws = JSON.stringify(transition_body)

                this.socket.send(transition_app_ws)
            }
        }
    }


    /**

     */
    async transaction_handler(req_hash,message) {
        if ( this.chat_room_members[req_hash] ) {
            
        }
        return false
    }
    

    async process_ws_json_rpc(method, parameters) {
        //
        let ccwid = g_current_pub_identity ? g_current_pub_identity.ccwid : false
        if ( ccwid ) {
            // msg is completed in the cases and returned after the switch
            let msg = {
                "category" : FRAME_TO_CHAT,
                "data" : {
                    "session" : this.session,   // a human page session... 
                    "ccwid" : g_current_pub_identity ? g_current_pub_identity.ccwid : false,
                    "req_hash" : parameters.req_hash
                }
            }
            //
            switch ( method ) {
                case "joining"  : {
                    let req_hash = parameters.req_hash
                    if ( this.requesting_members[req_hash] ) {
                        msg.action = CHAT_JOIN_OK
                        this.chat_room_members[req_hash] = this.requesting_members[req_hash]
                        msg.data.display_info = parameters.display_info
                        msg.data.humaness = parameters.from_business ? 0 : 10
                    } else return;
                    break;
                }
                case "leaving"  : {
                    let req_hash = parameters.req_hash
                    if ( this.requesting_members[req_hash] ) {
                        msg.action = CHAT_LEAVING
                        delete this.chat_room_members[req_hash]
                        delete this.requesting_members[req_hash]
                    } else return;
                    break;
                }
                case "message" : {
                    let req_hash = parameters.req_hash
                    if ( this.chat_room_members[req_hash] ) {
                        msg.action = CHAT_MESSAGE
                        msg.data.text = parameters.text
                        msg.data.is_html = parameters.is_html
                        msg.data.contains_media = parameters.contains_media
                        if ( msg.data.contains_media ) {
                            msg.data.media_url = parameters.media_url
                            msg.data.mime_type = parameters.mime_type
                        }
                    } else {
                        msg.action = UNAUTHORIZED_CHAT_MESSAGE
                        msg.data.hash_id = req_hash
                    }
                    break
                }
                case "transaction" : {
                    let req_hash = parameters.req_hash
                    let proceed = await this.transaction_handler(req_hash,message)
                    // opportunity to display the result of a transaction...
                    if ( proceed && this.chat_room_members[req_hash] ) {
                        msg.action = CHAT_TRANSACTION
                        msg.data.text = parameters.text
                        msg.data.is_html = parameters.is_html
                        msg.data.contains_media = parameters.contains_media
                        if ( msg.data.contains_media ) {
                            msg.data.media_url = parameters.media_url
                            msg.data.mime_type = parameters.mime_type
                        }
                    } else {
                        msg.action = UNAUTHORIZED_CHAT_MESSAGE
                        msg.data.hash_id = req_hash
                    }
                    break
                }
            }
            //
            tell_chat_page(msg)
        }
        //
    }

    async setup_websockets_chat_room() {

        // websocket offering to chats that supply out of frame connectivity

        try {
            const socket = new WebSocket(this.server_ur);
            let socket_owner = this

            this.set_socket(socket)

            // Connection opened
            socket.addEventListener("open", (event) => {
                let ccwid = g_current_pub_identity ? g_current_pub_identity.ccwid : false
                if ( ccwid ) {
                    let chat_room_opener = {
                        "human_page" : window.location.hostname,
                        "ccwid" : g_current_pub_identity ? g_current_pub_identity.ccwid : false,
                    }
                    let JSON_rpc = {
                        "JSON" : "JSON-RPC 2.0",
                        "parameters" : chat_room_opener
                    }
                    let msg = JSON.stringify(JSON_rpc)
                    socket.send(msg);
                }
            });

            // Listen for messages
            socket.addEventListener("message", (event) => {
                try {
                    let ev_message = JSON.parse(event.data)
                    if ( (ev_message.status === "connected") &&  (ev_message.type === "ws_id") ) {
                        let ws_id = ev_message.ws_id
                        socket_owner.ws_id = ws_id
                    } else {
                        if ( ev_message.error ) {
                            socket_owner.handle_ws_json_rpc_error(ev_message)
                        } else {
                            socket_owner.process_ws_json_rpc(ev_message.method,ev_message.parameters)
                        }
                    }

                } catch (e) {
                }

            });

            // Listen for messages
            socket.addEventListener("error", (event) => {
            });

            // Listen for messages
            socket.addEventListener("close", (event) => {
            });

        } catch (e) {

        }
    }
